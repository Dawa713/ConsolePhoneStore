services:
  phonestore:
    build:
      context: .
      dockerfile: Dockerfile
    image: a27959svalero/consolephonestore:latest
    container_name: phonestore_app

    # OBLIGATORIO para aplicaciones de consola interactivas
    stdin_open: true   # equivale a docker run -i
    tty: true          # equivale a docker run -t

    # Puerto: 4 últimas cifras del usuario de San Valero (a27959svalero -> 7959)
    ports:
      - "7959:7959"

    # Volumen para persistencia de datos en el host
    # customers.json, phones.json y purchases.txt viven todos dentro de Data/,
    # así que un único volumen cubre los 3 archivos de datos.
    volumes:
      - ./Data:/app/Data

    restart: "no"  # app de consola: no reiniciar automáticamente
